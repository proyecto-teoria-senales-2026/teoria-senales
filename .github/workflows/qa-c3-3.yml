name: QA C3-3

on:
  push:
    branches:
      - c3-3-interfaz
  pull_request:
    branches:
      - main

jobs:
  prueba-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Preparar gráficas
        env:
          MPLBACKEND: Agg
        run: python -c "import matplotlib.pyplot as plt; fig = plt.figure(); plt.close(fig); print('Graficas preparadas')"

      - name: Ejecutar pruebas
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

      - name: Probar generación completa
        run: python main.py --demo
